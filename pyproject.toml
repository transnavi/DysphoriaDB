[project]
name = "dysphoriadb"
version = "0.1.0"
description = "Collectors and data pipeline for recurring gender-related phenomena"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.13,<5"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
