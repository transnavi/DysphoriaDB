<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A browsable reference of recurring gender experiences."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" id="theme-color" content="#fffdf8" />
    <script>
      (() => {
        const storageKey = "gender-experience-theme";
        let theme;
        try {
          const savedTheme = localStorage.getItem(storageKey);
          theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector("#theme-color").content = theme === "dark" ? "#1a1624" : "#fffdf8";
      })();
    </script>
    <link rel="canonical" href="https://db.transnavi.jp/" />
    <link rel="alternate" hreflang="en" href="https://db.transnavi.jp/" />
    <link rel="alternate" hreflang="x-default" href="https://db.transnavi.jp/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta property="og:url" content="https://db.transnavi.jp/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gender Experience Index" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Gender Experience Index" />
    <meta property="og:description" content="A browsable reference of recurring gender experiences." />
    <meta property="og:image" content="https://db.transnavi.jp/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Gender Experience Index" />

    <meta name="twitter:title" content="Gender Experience Index" />
    <meta name="twitter:description" content="A browsable reference of recurring gender experiences." />
    <meta name="twitter:image" content="https://db.transnavi.jp/og-image.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <script type="application/ld+json" id="structured-data">
      {"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://db.transnavi.jp/#website","url":"https://db.transnavi.jp/","name":"Gender Experience Index","description":"A browsable reference of recurring gender experiences.","inLanguage":"en"},{"@type":"DefinedTermSet","@id":"https://db.transnavi.jp/#index","url":"https://db.transnavi.jp/","name":"Gender Experience Index","description":"A browsable reference of recurring gender experiences.","inLanguage":"en","isPartOf":{"@id":"https://db.transnavi.jp/#website"}}]}
    </script>
    <title>Gender Experience Index</title>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="wordmark" href="/">Gender Experience Index</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Use dark theme" title="Use dark theme">
          <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20.2 15.4A8.3 8.3 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z" />
          </svg>
          <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3.5" />
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="intro">
        <h1>How people experience gender</h1>
        <p>The index documents how gender dysphoria and euphoria are felt, expressed, and understood across transgender and gender-diverse communities.</p>
      </div>

      <section class="browser" aria-label="Browse experiences">
        <div id="browse-view">
          <label class="search">
            <span class="visually-hidden">Search experiences</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
            <input id="search" type="search" placeholder="Search experiences" autocomplete="off" />
          </label>
          <nav class="domain-tabs" id="domain-tabs" aria-label="Experience areas"></nav>

          <div class="active-filters" id="active-filters"></div>
          <p class="result-count" id="result-count" aria-live="polite"></p>
          <div class="cards" id="cards"></div>
          <p class="empty" id="empty" hidden>No experiences match this search.</p>
        </div>
        <div class="experience-detail" id="experience-detail" hidden></div>
      </section>

    </main>

    <script src="/site/app.js" type="module"></script>
  </body>
</html>
